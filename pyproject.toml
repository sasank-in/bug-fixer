[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoqa"
version = "0.1.0"
description = "An autonomous QA engineer: fuzzes APIs, traces failures, reports actionable bugs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
autoqa = "autoqa.cli:main"

[tool.setuptools.packages.find]
include = ["autoqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
